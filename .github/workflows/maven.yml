# This workflow will build a Java project with Maven, cache/restore any dependencies to improve the workflow execution time,
# build a Docker image, and deploy the application to Azure Web App for staging/production.

name: Java CI with Maven and Docker

on:
  push:
    branches: [ "feature-crudSemaforo" ]
  pull_request:
    branches: [ "feature-crudSemaforo" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Checkout the code from the repository
    - uses: actions/checkout@v4

    # Set up JDK 17 for the project
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Build the project with Maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # Optional: Upload the full dependency graph to GitHub to improve Dependabot alerts
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

    # Build Docker image
    - name: Build Docker image
      run: docker build -t myapp .

    # Optional: Push Docker image to Docker Hub (or another registry)
    - name: Push Docker image
      run: |
        docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        docker push myapp

    # Deploy to Azure Web App
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: <nome-do-app>  # Substitua pelo nome do seu app no Azure
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}  # Secret com o perfil de publicação do Azure
        package: target/myapp.jar  # Local do arquivo JAR gerado após o build Maven
